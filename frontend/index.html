<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/eb-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EvidenceBridge — Audit UI</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('evidencebridge_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-cream-100 dark:bg-adjudo-dark text-adjudo-black dark:text-neutral-100 antialiased selection:bg-orange-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
